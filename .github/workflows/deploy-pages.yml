name: Deploy web test build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "chess-engine/**"
      - "web-engine/**"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # The bot's own code lives in a separate repo (chess-game-bot) and this build always compiles
  # against its latest main branch (see updateBotSubmodule in build.gradle.kts) — but a push over
  # there doesn't trigger a push here, so the deployed site wouldn't otherwise notice a bot-only
  # change. This keeps the live site current without needing a cross-repo trigger.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # chess-bot: the bot's own code, developed in a separate repo (chess-game-bot) and
          # pulled in here as a git submodule. Not --recursive: that submodule's own nested
          # submodule (its copy of this repo, used only so it can build/test standalone) isn't
          # needed to build this site.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the shared engine's test suite on the JS target
        run: ./gradlew :web-engine:nodeTest

      # Rebuilds the chess rules/clock engine for the browser from source, so the deployed
      # bundle is always current even if the committed web/chess-engine.js was stale.
      - name: Build the Kotlin/JS engine bundle
        run: ./gradlew :web-engine:browserProductionWebpack

      - name: Copy the fresh bundle into the static site
        run: cp web-engine/build/kotlin-webpack/js/productionExecutable/chess-engine.js web/chess-engine.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
